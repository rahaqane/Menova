<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>signUp1 page</title>
    <link href="./assets/css/output.css" rel="stylesheet" />
  </head>
  <body class="bg-surface">
    <div class="relative overflow-hidden">
      <div class="absolute inset-0 z-0 pointer-events-none"></div>
      <header
        class="p-4 lg:px-30 flex justify-between items-center bg-[#252C3F] backdrop-blur-md border-y border-y-white/16"
      >
        <img src="./assets/icons/logo.svg" alt="" srcset="" />
        <button class="flex gap-2 items-center text-txt-cta">
          بازگشت <img src="./assets/icons/left-prev.svg" alt="" srcset="" />
        </button>
      </header>
      <main>
        <section>
          <div class="flex flex-col lg:flex-row-reverse gap-8 lg:gap-10">
            <div class="lg:w-1/2 w-full">
              <img
                src="./assets/images/s1.webp"
                class="w-full h-full min-h-screen object-cover"
              />
            </div>
            <form
              class="flex flex-col bg-surface border border-surface-icon rounded-[28px] px-4 py-5 gap-5 w-full"
            >
              <div class="flex flex-col md:flex-row w-full gap-2">
                <div class="flex flex-col gap-2">
                  <p class="text-base font-medium text-txt-muted">
                    نام و نام خانوادگی
                  </p>
                  <input
                    type="text"
                    placeholder="نام کامل خود را وارد کنید..."
                    class="bg-surface-elevated border border-surface-icon outline-none focus:outline-none rounded-xl p-2 placeholder:text-txt-placeholder"
                  />
                </div>
                <div class="flex flex-col gap-2">
                  <p class="text-base font-medium text-txt-muted">شماره تماس</p>
                  <input
                    type="text"
                    placeholder="مثلا ...0913"
                    class="bg-surface-elevated border border-surface-icon outline-none focus:outline-none rounded-xl p-2 placeholder:text-txt-placeholder"
                  />
                </div>
              </div>
              <div class="flex flex-col w-full gap-2">
                <p class="text-base font-medium text-txt-muted">موضوع</p>
                <div class="dropdown relative w-full lg:inline-block">
                  <button
                    type="button"
                    class="dropdown-toggle bg-surface-elevated border p-2 rounded-xl border-surface-icon text-txt-placeholder group flex items-center justify-between gap-4 w-full"
                  >
                    <div class="flex items-center gap-2">
                      <span class="selected-text whitespace-nowrap">
                        موضوع پیغام خود را انتخاب کنید</span
                      >
                    </div>

                    <svg
                      class="dropdown-arrow w-4 h-4 transition-transform duration-300 text-txt-placeholder group-focus:text-txt-cta"
                      viewBox="0 0 18 18"
                      fill="none"
                    >
                      <path
                        d="M14.94 6.71L10.05 11.60C9.47 12.18 8.52 12.18 7.95 11.60L3.06 6.71"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                  </button>

                  <div
                    class="dropdown-menu absolute top-full left-0 mt-2 hidden rounded-lg shadow-lg min-w-full"
                  >
                    <div class="dropdown-item fillter cursor-pointer">
                      گزینه ها
                    </div>
                    <div class="dropdown-item fillter cursor-pointer">
                      گزینه ها
                    </div>
                    <div class="dropdown-item fillter cursor-pointer">
                      گزینه ها
                    </div>
                  </div>
                </div>
              </div>
              <div class="flex flex-col w-full gap-2">
                <p class="text-base font-medium text-txt-muted">متن پیام</p>
                <textarea
                  placeholder="متن اتقاد، پیشنهاد، درخواست..."
                  class="bg-surface-elevated border border-surface-icon overflow-y-auto scrollbar-hide resize-none rounded-xl p-2 placeholder:text-txt-placeholder min-h-30"
                ></textarea>
              </div>
              <button
                class="flex justify-center items-center btn-plans w-full p-2 mt-5"
              >
                ارسال پیام
              </button>
              <p class="text-sm font-normal text-txt-placeholder text-center">
                اطلاعات شما نزد منوا محفوظ خواهد ماند و فقط برای پاسخگویی به شما
                استفاده می‌شود
              </p>
            </form>
          </div>
        </section>
      </main>
    </div>
    <script src="./assets/js/script.js"></script>
  </body>
</html>
