<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>forgot password01 page</title>
    <link href="./assets/css/output.css" rel="stylesheet" />
  </head>
  <body class="bg-surface">
    <div class="relative overflow-hidden">
      <div class="absolute inset-0 z-0 pointer-events-none"></div>
      <header
        class="p-4 lg:px-30 flex justify-between items-center bg-[#252C3F] backdrop-blur-md border-y border-y-white/16"
      >
        <img src="./assets/icons/logo.svg" alt="" srcset="" />
        <a
          href="./login.html"
          class="flex gap-2 items-center text-txt-cta cursor-pointer"
        >
          بازگشت <img src="./assets/icons/left-prev.svg" alt="" srcset="" />
        </a>
      </header>
      <main>
        <section>
          <div class="flex flex-col lg:flex-row-reverse gap-8 lg:gap-10">
            <div class="relative lg:w-1/2 w-full shrink-0">
              <div
                class="lg:hidden absolute top-40 inset-0 bg-linear-to-t from-surface to-transparent"
              ></div>
              <img
                src="./assets/images/s1.webp"
                class="w-full h-full object-cover"
              />
            </div>
            <form
              class="flex flex-col px-4 py-5 gap-5 flex-1 lg:mr-30 lg:mt-30"
            >
              <div class="flex flex-col gap-2 w-full">
                <h3 class="text-2xl font-bold lg:text-4xl text-txt-main">
                  ورود با کد یکبار مصرف
                </h3>
                <p
                  class="flex gap-2 text-txt-placeholder text-xs lg:text-sm font-normal mb-15 lg:mb-25"
                >
                  شماره تماس خود را وارد کنید تا کد 4 رقمی برای شما ارسال شود.
                </p>
              </div>

              <div class="flex flex-col w-full gap-2">
                <p class="text-base font-medium text-txt-muted">شماره موبایل</p>
                <div class="form-input-container mb-40 lg:mb-0">
                  <img src="./assets/icons/email.svg" class="w-5 h-5" />

                  <input
                    type="text"
                    placeholder="مثلا ...۰۹۱۳"
                    class="form-input"
                  />
                </div>
              </div>
              <button
                class="flex justify-center items-center btn-plans w-full p-2 mt-5"
              >
                <a href="./forgot-password02.html"> ارسال کد </a>
              </button>
            </form>
          </div>
        </section>
      </main>
    </div>
    <script src="./assets/js/script.js"></script>
  </body>
</html>
